# main へ push するたびに Web版（dist/）を組み立てて GitHub Pages へ配信します。
# ビルドは Node.js だけで完結し、npm の依存パッケージは使いません。
# テストが1つでも失敗するとビルドが止まり、配信されません。
name: Deploy web version to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に複数の配信が走らないようにします。古い実行は取り消します。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build web version (runs tests first)
        run: node tools/build-release.mjs --web-only
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ブラウザ検査（Playwright、Chromium のみ）。配信ジョブとは独立に走らせ、配信を待たせません。
  # 失敗しても配信は止めない代わりに、Actions の一覧で赤く表示されるので気づけます。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build web version for the PWA checks
        run: node tools/build-release.mjs --web-only
      - run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
